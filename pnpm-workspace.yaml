packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  '@swc/core': true
  '@prisma/engines': true
  prisma: true
  argon2: true
  sharp: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  '@parcel/watcher': true
  # Dev-only portable PostgreSQL (scripts/local-stack.mjs); the script only restores binary symlinks.
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  # Usage telemetry pulled in by swagger-ui-dist: never run.
  '@scarf/scarf': false
