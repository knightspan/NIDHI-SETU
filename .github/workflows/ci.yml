name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint · typecheck · test · build (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: nidhisetu
          POSTGRES_PASSWORD: nidhisetu_ci_password
          POSTGRES_DB: nidhisetu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nidhisetu" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8.3-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://nidhisetu:nidhisetu_ci_password@localhost:5432/nidhisetu_test
      REDIS_URL: redis://localhost:6379
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dev placeholder secrets (the CI env above overrides the database URL).
      - run: cp .env.example .env
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Domain coverage gate (≥ 80 %)
        run: pnpm --filter @nidhisetu/api test:coverage
      - run: pnpm build
      - name: Load test — lifecycle job over 10 000 deposits in < 60 s
        run: pnpm load-test

  ocr:
    name: Lint · test (OCR service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ocr
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ocr/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
